<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c27;
    --accent: #00ff88;
    --accent2: #ff6b35;
    --accent3: #7b61ff;
    --text: #e8e8f0;
    --muted: #5a5a7a;
    --danger: #ff3355;
    --border: #2a2a3a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 20% 20%, rgba(0,255,136,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(123,97,255,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 16px; }

  /* HEADER */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .stats-pill {
    display: flex;
    gap: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }

  .stats-pill span { color: var(--accent); }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }

  .tab {
    flex: 1;
    padding: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab.active {
    background: var(--surface2);
    color: var(--text);
  }

  /* PANELS */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ACTIVE TASK */
  .active-task-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .active-task-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
  }

  .task-label {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
    font-family: 'Space Mono', monospace;
  }

  .task-name {
    font-size: 1.2rem;
    font-weight: 800;
    margin-bottom: 20px;
    color: var(--text);
  }

  /* CHRONOMETER */
  .chrono-display {
    text-align: center;
    margin: 16px 0;
  }

  .chrono-time {
    font-family: 'Space Mono', monospace;
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: -2px;
    color: var(--accent);
    line-height: 1;
    transition: color 0.3s;
  }

  .chrono-time.countdown { color: var(--accent2); }
  .chrono-time.warning { color: var(--danger); animation: pulse 0.5s infinite alternate; }

  @keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }

  .chrono-mode {
    font-size: 0.65rem;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 4px;
  }

  /* MODE SELECTOR */
  .mode-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .mode-btn {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,255,136,0.05);
  }

  /* COUNTDOWN INPUT */
  .countdown-input {
    display: none;
    gap: 8px;
    margin-bottom: 12px;
    align-items: center;
  }

  .countdown-input.visible { display: flex; }

  .countdown-input input {
    width: 60px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    padding: 8px;
    border-radius: 8px;
    text-align: center;
  }

  .countdown-input label {
    font-size: 0.7rem;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  /* CONTROLS */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .btn {
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:active { transform: scale(0.95); }

  .btn-primary { background: var(--accent); color: #000; grid-column: span 2; }
  .btn-stop { background: var(--danger); color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-save { background: var(--accent3); color: #fff; }
  .btn-queue { background: var(--surface2); color: var(--accent2); border: 1px solid var(--accent2); }
  .btn-full { grid-column: span 3; }
  .btn-half { grid-column: span 1; }

  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* NO TASK */
  .no-task {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }

  .no-task .icon { font-size: 3rem; margin-bottom: 12px; }
  .no-task p { font-size: 0.9rem; }

  /* ADD TASK FORM */
  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .add-form h3 {
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .form-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    padding: 10px 12px;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--muted); }

  .priority-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    padding: 10px 8px;
    border-radius: 10px;
    outline: none;
    width: 110px;
  }

  /* QUEUE */
  .queue-list { display: flex; flex-direction: column; gap: 8px; }

  .queue-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color 0.2s;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .queue-item.priority-alta { border-left: 3px solid var(--danger); }
  .queue-item.priority-media { border-left: 3px solid var(--accent2); }
  .queue-item.priority-baja { border-left: 3px solid var(--accent); }

  .queue-pos {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    min-width: 20px;
  }

  .queue-info { flex: 1; }

  .queue-name {
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .queue-meta {
    font-size: 0.7rem;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .queue-actions { display: flex; gap: 4px; }

  .icon-btn {
    width: 30px; height: 30px;
    border: none;
    border-radius: 8px;
    background: var(--surface2);
    color: var(--muted);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }

  .icon-btn:hover { color: var(--text); }
  .icon-btn.start-btn:hover { background: rgba(0,255,136,0.15); color: var(--accent); }
  .icon-btn.del-btn:hover { background: rgba(255,51,85,0.15); color: var(--danger); }

  /* STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }

  .stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .history-list { display: flex; flex-direction: column; gap: 8px; }

  .history-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .history-item.completed { border-left: 3px solid var(--accent); }
  .history-item.stopped { border-left: 3px solid var(--accent2); }

  .history-name { font-size: 0.9rem; font-weight: 600; margin-bottom: 2px; }
  .history-date { font-size: 0.65rem; color: var(--muted); font-family: 'Space Mono', monospace; }

  .history-time {
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    color: var(--accent);
    text-align: right;
  }

  .history-status {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
  }

  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .section-title {
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 10px;
    margin-top: 16px;
  }

  .clear-btn {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.2s;
  }

  .clear-btn:hover { background: rgba(255,51,85,0.1); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-family: 'Space Mono', monospace;
    transition: transform 0.3s;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* COMPLETION MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }

  .modal h2 { font-size: 1.4rem; margin-bottom: 8px; }
  .modal p { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  .modal .time-big {
    font-family: 'Space Mono', monospace;
    font-size: 2.5rem;
    color: var(--accent);
    margin: 12px 0;
  }

  .modal-btns { display: flex; gap: 8px; }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>TaskFlow</h1>
    <div class="stats-pill">
      ✓ <span id="hdr-done">0</span> &nbsp; ⏳ <span id="hdr-queue">0</span>
    </div>
  </header>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="showTab('tab-active')">▶ Activa</button>
    <button class="tab" onclick="showTab('tab-queue')">☰ Cola</button>
    <button class="tab" onclick="showTab('tab-stats')">◈ Stats</button>
  </div>

  <!-- TAB: TAREA ACTIVA -->
  <div id="tab-active" class="panel active">

    <div id="no-task" class="no-task">
      <div class="icon">📋</div>
      <p>No hay tarea activa.<br>Agrega una en la cola.</p>
    </div>

    <div id="active-card" class="active-task-card" style="display:none">
      <div class="task-label">Tarea en curso</div>
      <div id="active-name" class="task-name">—</div>

      <div class="mode-selector">
        <button class="mode-btn active" id="mode-up" onclick="setMode('up')">▲ Contar arriba</button>
        <button class="mode-btn" id="mode-down" onclick="setMode('down')">▼ Cuenta regresiva</button>
      </div>

      <div class="countdown-input" id="countdown-input">
        <input type="number" id="cd-h" value="0" min="0" max="99" placeholder="0">
        <label>h</label>
        <input type="number" id="cd-m" value="5" min="0" max="59" placeholder="5">
        <label>m</label>
        <input type="number" id="cd-s" value="0" min="0" max="59" placeholder="0">
        <label>s</label>
      </div>

      <div class="chrono-display">
        <div class="chrono-time" id="chrono">00:00:00</div>
        <div class="chrono-mode" id="chrono-mode">listo</div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="btn-start" onclick="startChrono()">▶ Iniciar</button>
        <button class="btn btn-stop" id="btn-stop" onclick="stopTask()" disabled>■ Detener</button>
        <button class="btn btn-secondary btn-half" id="btn-pause" onclick="pauseChrono()" disabled>⏸</button>
        <button class="btn btn-save btn-half" id="btn-done" onclick="completeTask()" disabled>✓ Hecho</button>
        <button class="btn btn-queue btn-full" onclick="queueAndNext()">↷ Cola + Siguiente</button>
      </div>
    </div>

  </div>

  <!-- TAB: COLA -->
  <div id="tab-queue" class="panel">

    <div class="add-form">
      <h3>+ Nueva tarea</h3>
      <div class="form-row">
        <input class="form-input" id="task-input" placeholder="Nombre de la tarea..." onkeydown="if(event.key==='Enter')addTask()">
      </div>
      <div class="form-row">
        <input class="form-input" id="task-desc" placeholder="Descripción (opcional)...">
        <select class="priority-select" id="task-priority">
          <option value="baja">🟢 Baja</option>
          <option value="media" selected>🟡 Media</option>
          <option value="alta">🔴 Alta</option>
        </select>
      </div>
      <div class="form-row">
        <button class="btn btn-primary btn-full" style="grid-column:span 1;width:100%" onclick="addTask()">Agregar a la cola</button>
      </div>
    </div>

    <div class="section-title">En cola (<span id="queue-count">0</span>)</div>
    <div id="queue-list" class="queue-list">
      <div class="empty-state">La cola está vacía</div>
    </div>

  </div>

  <!-- TAB: ESTADÍSTICAS -->
  <div id="tab-stats" class="panel">

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Completadas</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-stopped">0</div>
        <div class="stat-label">Detenidas</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-time">0m</div>
        <div class="stat-label">Tiempo total</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-avg">0m</div>
        <div class="stat-label">Promedio</div>
      </div>
    </div>

    <div class="section-title">Historial</div>
    <div id="history-list" class="history-list">
      <div class="empty-state">Sin historial aún</div>
    </div>

    <button class="clear-btn" onclick="clearHistory()">🗑 Limpiar historial</button>

  </div>
</div>

<!-- MODAL COMPLETADO -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div style="font-size:2.5rem" id="modal-icon">🎉</div>
    <h2 id="modal-title">¡Tarea completada!</h2>
    <p id="modal-task-name">—</p>
    <div class="time-big" id="modal-time">00:00:00</div>
    <p id="modal-msg">Tiempo registrado</p>
    <div class="modal-btns">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-primary" style="flex:1" onclick="closeModal(); nextTask()">▶ Siguiente</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── STATE ───────────────────────────────────────
let queue = JSON.parse(localStorage.getItem('tf_queue') || '[]');
let history = JSON.parse(localStorage.getItem('tf_history') || '[]');
let activeTask = JSON.parse(localStorage.getItem('tf_active') || 'null');

let chronoInterval = null;
let elapsedSeconds = 0;
let countdownSeconds = 0;
let isRunning = false;
let isPaused = false;
let chronoMode = 'up'; // 'up' | 'down'

// ─── INIT ─────────────────────────────────────────
function init() {
  renderQueue();
  renderHistory();
  updateStats();
  updateHeader();
  if (activeTask) showActiveCard(activeTask);
}

// ─── TABS ─────────────────────────────────────────
function showTab(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

// ─── QUEUE ────────────────────────────────────────
function addTask() {
  const name = document.getElementById('task-input').value.trim();
  if (!name) { showToast('Escribe el nombre de la tarea'); return; }
  const desc = document.getElementById('task-desc').value.trim();
  const priority = document.getElementById('task-priority').value;
  const task = { id: Date.now(), name, desc, priority, added: new Date().toISOString() };
  queue.push(task);
  saveQueue();
  document.getElementById('task-input').value = '';
  document.getElementById('task-desc').value = '';
  renderQueue();
  updateHeader();
  showToast('Tarea agregada ✓');
}

function removeFromQueue(id) {
  queue = queue.filter(t => t.id !== id);
  saveQueue();
  renderQueue();
  updateHeader();
}

function startFromQueue(id) {
  const task = queue.find(t => t.id === id);
  if (!task) return;
  if (activeTask) {
    if (!confirm('¿Reemplazar la tarea activa?')) return;
    stopChrono();
  }
  queue = queue.filter(t => t.id !== id);
  saveQueue();
  setActiveTask(task);
  showTab('tab-active');
  document.querySelector('.tab').click();
  document.querySelectorAll('.tab')[0].click();
  document.querySelectorAll('.panel')[0].classList.add('active');
  document.querySelectorAll('.tab')[0].classList.add('active');
  renderQueue();
  updateHeader();
}

function renderQueue() {
  const list = document.getElementById('queue-list');
  document.getElementById('queue-count').textContent = queue.length;
  if (!queue.length) {
    list.innerHTML = '<div class="empty-state">La cola está vacía</div>';
    return;
  }
  list.innerHTML = queue.map((t, i) => `
    <div class="queue-item priority-${t.priority}">
      <div class="queue-pos">#${i+1}</div>
      <div class="queue-info">
        <div class="queue-name">${t.name}</div>
        <div class="queue-meta">${t.priority.toUpperCase()} ${t.desc ? '· '+t.desc : ''}</div>
      </div>
      <div class="queue-actions">
        <button class="icon-btn start-btn" onclick="startFromQueue(${t.id})" title="Iniciar">▶</button>
        <button class="icon-btn del-btn" onclick="removeFromQueue(${t.id})" title="Eliminar">✕</button>
      </div>
    </div>
  `).join('');
}

// ─── ACTIVE TASK ──────────────────────────────────
function setActiveTask(task) {
  activeTask = task;
  localStorage.setItem('tf_active', JSON.stringify(task));
  elapsedSeconds = 0;
  isRunning = false;
  isPaused = false;
  updateChronoDisplay();
  showActiveCard(task);
}

function showActiveCard(task) {
  document.getElementById('no-task').style.display = 'none';
  document.getElementById('active-card').style.display = 'block';
  document.getElementById('active-name').textContent = task.name;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('btn-done').disabled = true;
  document.getElementById('btn-pause').disabled = true;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('chrono-mode').textContent = 'listo';
}

function setMode(mode) {
  chronoMode = mode;
  document.getElementById('mode-up').classList.toggle('active', mode === 'up');
  document.getElementById('mode-down').classList.toggle('active', mode === 'down');
  const cdInput = document.getElementById('countdown-input');
  cdInput.classList.toggle('visible', mode === 'down');
  elapsedSeconds = 0;
  updateChronoDisplay();
}

function startChrono() {
  if (isRunning) return;
  if (chronoMode === 'down') {
    const h = parseInt(document.getElementById('cd-h').value) || 0;
    const m = parseInt(document.getElementById('cd-m').value) || 0;
    const s = parseInt(document.getElementById('cd-s').value) || 0;
    countdownSeconds = h*3600 + m*60 + s;
    if (!countdownSeconds) { showToast('Pon un tiempo para la cuenta regresiva'); return; }
    elapsedSeconds = 0;
  }
  isRunning = true;
  isPaused = false;
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('btn-done').disabled = false;
  document.getElementById('btn-pause').disabled = false;
  document.getElementById('chrono-mode').textContent = chronoMode === 'up' ? 'cronómetro ▲' : 'cuenta regresiva ▼';
  chronoInterval = setInterval(tickChrono, 1000);
}

function tickChrono() {
  elapsedSeconds++;
  updateChronoDisplay();
  if (chronoMode === 'down') {
    const remaining = countdownSeconds - elapsedSeconds;
    if (remaining <= 0) {
      clearInterval(chronoInterval);
      isRunning = false;
      showToast('⏰ ¡Tiempo agotado!');
      document.getElementById('chrono').classList.add('warning');
      completeTask('timeout');
    }
  }
}

function pauseChrono() {
  if (!isRunning && !isPaused) return;
  if (isRunning) {
    clearInterval(chronoInterval);
    isRunning = false;
    isPaused = true;
    document.getElementById('btn-pause').textContent = '▶';
    document.getElementById('chrono-mode').textContent = 'pausado';
  } else {
    isRunning = true;
    isPaused = false;
    document.getElementById('btn-pause').textContent = '⏸';
    document.getElementById('chrono-mode').textContent = chronoMode === 'up' ? 'cronómetro ▲' : 'cuenta regresiva ▼';
    chronoInterval = setInterval(tickChrono, 1000);
  }
}

function stopChrono() {
  clearInterval(chronoInterval);
  isRunning = false;
  isPaused = false;
}

function updateChronoDisplay() {
  let displaySecs;
  if (chronoMode === 'down') {
    displaySecs = Math.max(0, countdownSeconds - elapsedSeconds);
    const el = document.getElementById('chrono');
    el.classList.remove('warning');
    el.classList.add('countdown');
    if (displaySecs <= 10 && isRunning) el.classList.add('warning');
  } else {
    displaySecs = elapsedSeconds;
    document.getElementById('chrono').classList.remove('countdown', 'warning');
  }
  document.getElementById('chrono').textContent = formatTime(displaySecs);
}

function stopTask() {
  if (!activeTask) return;
  stopChrono();
  saveToHistory(activeTask, elapsedSeconds, 'stopped');
  clearActiveTask();
  showToast('Tarea detenida y guardada');
  updateStats();
  renderHistory();
  nextTask();
}

function completeTask(reason) {
  if (!activeTask) return;
  stopChrono();
  const task = activeTask;
  const secs = elapsedSeconds;
  saveToHistory(task, secs, 'completed');
  clearActiveTask();
  updateStats();
  renderHistory();
  // Show modal
  document.getElementById('modal-icon').textContent = reason === 'timeout' ? '⏰' : '🎉';
  document.getElementById('modal-title').textContent = reason === 'timeout' ? '¡Tiempo agotado!' : '¡Tarea completada!';
  document.getElementById('modal-task-name').textContent = task.name;
  document.getElementById('modal-time').textContent = formatTime(secs);
  document.getElementById('modal-msg').textContent = 'Tiempo registrado en estadísticas';
  document.getElementById('modal').classList.add('show');
}

function queueAndNext() {
  if (!activeTask) return;
  stopChrono();
  queue.push(activeTask);
  saveQueue();
  clearActiveTask();
  renderQueue();
  showToast('Tarea devuelta a la cola');
  nextTask();
}

function clearActiveTask() {
  activeTask = null;
  localStorage.removeItem('tf_active');
  elapsedSeconds = 0;
  document.getElementById('no-task').style.display = 'block';
  document.getElementById('active-card').style.display = 'none';
  document.getElementById('chrono').classList.remove('countdown','warning');
  document.getElementById('chrono').textContent = '00:00:00';
}

function nextTask() {
  if (queue.length > 0) {
    const next = queue.shift();
    saveQueue();
    setActiveTask(next);
    renderQueue();
    updateHeader();
    showToast(`Siguiente: ${next.name}`);
  } else {
    showToast('Cola vacía — agrega más tareas');
  }
}

// ─── HISTORY ──────────────────────────────────────
function saveToHistory(task, secs, status) {
  history.unshift({
    id: Date.now(),
    name: task.name,
    priority: task.priority,
    secs,
    status,
    date: new Date().toISOString()
  });
  localStorage.setItem('tf_history', JSON.stringify(history));
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!history.length) {
    list.innerHTML = '<div class="empty-state">Sin historial aún</div>';
    return;
  }
  list.innerHTML = history.map(h => `
    <div class="history-item ${h.status}">
      <div>
        <div class="history-name">${h.name}</div>
        <div class="history-date">${formatDate(h.date)}</div>
      </div>
      <div class="history-time">
        ${formatTime(h.secs)}
        <div class="history-status">${h.status === 'completed' ? '✓ completada' : '■ detenida'}</div>
      </div>
    </div>
  `).join('');
}

function updateStats() {
  const completed = history.filter(h => h.status === 'completed').length;
  const stopped = history.filter(h => h.status === 'stopped').length;
  const totalSecs = history.reduce((a, h) => a + h.secs, 0);
  const avgSecs = history.length ? Math.round(totalSecs / history.length) : 0;
  document.getElementById('stat-total').textContent = completed;
  document.getElementById('stat-stopped').textContent = stopped;
  document.getElementById('stat-time').textContent = totalSecs < 3600 ? Math.round(totalSecs/60)+'m' : (totalSecs/3600).toFixed(1)+'h';
  document.getElementById('stat-avg').textContent = avgSecs < 3600 ? Math.round(avgSecs/60)+'m' : (avgSecs/3600).toFixed(1)+'h';
}

function clearHistory() {
  if (!confirm('¿Limpiar todo el historial?')) return;
  history = [];
  localStorage.removeItem('tf_history');
  renderHistory();
  updateStats();
  showToast('Historial eliminado');
}

// ─── MODAL ────────────────────────────────────────
function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

// ─── HELPERS ──────────────────────────────────────
function formatTime(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('es', {day:'2-digit',month:'short'}) + ' ' + d.toLocaleTimeString('es', {hour:'2-digit',minute:'2-digit'});
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function updateHeader() {
  document.getElementById('hdr-done').textContent = history.filter(h=>h.status==='completed').length;
  document.getElementById('hdr-queue').textContent = queue.length;
}

function saveQueue() {
  localStorage.setItem('tf_queue', JSON.stringify(queue));
}

init();
</script>
</body>
</html>
