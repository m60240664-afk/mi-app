name: Build APK

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Mover archivos a www
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5

      - name: Build APK
        run: |
          npx cap init "MiApp" "com.miapp.app" --web-dir www
          npx cap add android
          npx cap copy android
          cd android
          sed -i 's/classpath .com.android.tools.build:gradle.*/classpath "com.android.tools.build:gradle:8.1.1"/' build.gradle
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
